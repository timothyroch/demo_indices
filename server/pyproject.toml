[tool.poetry]
name = "server"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.128.1"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
python-dotenv = "^1.2.1"
httpx = "^0.28.0"
pandas = "^3.0.0"
joblib = "^1.5.3"
requests = "^2.32.5"
xgboost = "^3.2.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
bcrypt = "^4.2.0"
sqlalchemy = "^2.0.36"
shap = "^0.51.0"
twilio = "^9.0.0"
google-genai = "^1.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.poetry.scripts]
lint = "scripts.lint:main"
