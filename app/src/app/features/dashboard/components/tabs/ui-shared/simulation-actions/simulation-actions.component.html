<div class="sim-actions">
    <div class="sim-btn-group">
    <button type="button" class="sim-btn sim-btn--apply" [disabled]="isLoading" (click)="applySimulation.emit()">
        {{ simulationStrings.SIMULATION_APPLY }}
    </button>
    <button type="button" class="sim-btn sim-btn--reset" [disabled]="isLoading" (click)="resetSimulation.emit()">
        {{ simulationStrings.SIMULATION_RESET }}
    </button>
    </div>
</div>
