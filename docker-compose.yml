services:
  backend:
    image: poly-server:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTH_DB_PATH: /data/auth.db
      CORS_ORIGINS: "http://localhost http://51.79.101.90"
    volumes:
      - db_data:/data
      - ./models:/models:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, urllib.error, sys\ntry: urllib.request.urlopen('http://localhost:8000/api/weather-data?lat=45.5&lng=-73.5')\nexcept urllib.error.HTTPError: pass\nexcept Exception: sys.exit(1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal

  frontend:
    image: poly-app:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  db_data:
    driver: local

networks:
  internal:
    driver: bridge
